name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify scientific Python imports
        run: python -c "import numpy, pandas, sklearn, pyarrow, ib_async; import fastapi; print('scientific/API imports: OK')"

      - name: Compile application
        run: python -m compileall -q app

      - name: Run tests
        run: pytest -q
